services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_password, db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/10-create-mof.sh:/docker-entrypoint-initdb.d/10-create-mof.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  pgbouncer:
    depends_on:
      postgres:
        condition: service_healthy
secrets:
  postgres_password:
    file: ./config/postgres-password
volumes:
  pgdata:
    name: ${PG_DATA_VOLUME:-mofis-shared-db_pgdata}
